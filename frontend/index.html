<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCB Missing Component Detection</title>
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('pcb-theme');
          document.documentElement.classList.toggle('dark', saved === 'dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-fg antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
